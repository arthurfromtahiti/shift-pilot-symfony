name: Déploiement
# Publie la VERSION SERVIE sur la branche `deployed`, à un emplacement stable et
# lisible publiquement. C'est cette version-là qui fait foi : si ce workflow
# n'aboutit pas, le fichier reste celui du déploiement précédent — et un merge
# n'aura donc PAS produit de nouvelle version servie.
#
#   staging → deployed/staging/version.json
#   main    → deployed/production/version.json
#
# Le CONTRÔLE DE FUMÉE est ici, pas dans un commentaire : après migration, le
# workflow démarre réellement l'application et interroge un endpoint. Un test
# unitaire vert ne dit rien de l'application qui démarre.
on:
  push:
    branches: [main, staging]

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: composer install --no-interaction --prefer-dist

      # Une version ne se publie que si la suite passe. Un test rouge laisse
      # volontairement la version servie inchangée.
      - name: Tests avant publication
        run: composer test

      - name: Contrôle de fumée — l'application répond réellement
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t public > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 0.5
            CODE="$(curl -s -o /tmp/fumee.out -w '%{http_code}' http://127.0.0.1:8099/deliveries || true)"
            [ "$CODE" = "200" ] && break
          done
          if [ "${CODE:-000}" != "200" ]; then
            echo "Contrôle de fumée ÉCHOUÉ (HTTP ${CODE:-000}) — la version ne sera pas publiée."
            cat /tmp/serveur.log
            exit 1
          fi
          echo "Contrôle de fumée OK : GET /deliveries → 200"
          head -c 300 /tmp/fumee.out

      - name: Déterminer l'environnement
        id: env
        run: echo "cible=${{ github.ref_name == 'main' && 'production' || 'staging' }}" >> "$GITHUB_OUTPUT"

      - name: Publier la version servie
        run: |
          set -euo pipefail
          CIBLE="${{ steps.env.outputs.cible }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin deployed || true
          git checkout deployed 2>/dev/null || git checkout --orphan deployed
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'deployed' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p "$CIBLE"
          cat > "$CIBLE/version.json" <<JSON
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "environnement": "$CIBLE",
            "schemaVersion": 1,
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git add "$CIBLE/version.json"
          git commit -m "deploy($CIBLE): ${{ github.sha }}" || echo "rien à publier"
          git push origin deployed
